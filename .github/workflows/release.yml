name: 'Release'

on:
  push:
    branches: ['release/**']
    tags: ['[0-9]*']
  pull_request:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: '500M'

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            source:
              - 'src/**'
              - 'app/**'
              - 'tests/**'
              - 'cmake/**'
              - 'cmake.external/**'
              - 'external/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.github/actions/**'
              - '.github/workflows/release.yml'

  build-and-test:
    name: Build and Test (release)
    needs: changes
    # Tags always build; other events build only when source actually changed.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || needs.changes.outputs.source == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Second, independent checkout at a different source path; building from
      # both is what verifies -ffile-prefix-map actually makes the build
      # path-independent.  Only needed for tags.
      - name: Checkout Repository (second, independent)
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repro

      - name: Resolve ccache key
        id: ccache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-release-${{ steps.ccache-key.outputs.date }}
          restore-keys: |
            ccache-${{ runner.os }}-release-

      - name: Set reproducible build timestamp
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Install Build Dependencies
        uses: ./.github/actions/setup-deps

      - name: Install RPM packaging tools
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        run: sudo apt-get install -y rpm

      # Release branches and pull requests only verify the release profile;
      # packaging, the reproducibility check, SBOM, provenance and artifact
      # upload are all done for tags.
      - name: Configure, Build and Test
        run: cmake --workflow --preset=release-test

      - name: Package
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        run: cpack --preset=release

      - name: Configure (second checkout)
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        working-directory: repro
        run: cmake --preset=release

      # CCACHE_DISABLE forces a real recompile instead of reusing the primary
      # build's cached objects, so the two packages are genuinely independent.
      - name: Build (second checkout)
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        working-directory: repro
        env:
          CCACHE_DISABLE: '1'
        run: cmake --build --preset=release

      - name: Package (second checkout)
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        working-directory: repro
        run: cpack --preset=release

      - name: Verify reproducible TGZ
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        run: cmp build-release/*.tar.gz repro/build-release/*.tar.gz

      - name: Verify reproducible DEB
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        run: cmp build-release/*.deb repro/build-release/*.deb

      - name: Verify reproducible RPM
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        run: cmp build-release/*.rpm repro/build-release/*.rpm

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results
          path: build-release/test-results.xml
          if-no-files-found: ignore

      - name: Upload packages
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: |
            build-release/*.tar.gz
            build-release/*.deb
            build-release/*.rpm
          if-no-files-found: error

      - name: Generate SBOM
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: build-release/linyaps-box.spdx.json
          artifact-name: linyaps-box-sbom.spdx.json

      - name: Attest build provenance
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build-release/*.tar.gz
            build-release/*.deb
            build-release/*.rpm

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-release-${{ steps.ccache-key.outputs.date }}
