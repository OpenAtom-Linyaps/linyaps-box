name: 'CI'

on:
  push:
    branches: ['master']
  pull_request:
    branches-ignore: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPRESS: 'true'
  CCACHE_MAXSIZE: '500M'

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            source:
              - 'src/**'
              - 'app/**'
              - 'tests/**'
              - 'cmake/**'
              - 'cmake.external/**'
              - 'external/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  build-and-test:
    name: Build and Test (ASan/UBSan)
    needs: changes
    # Always report a (possibly skipped) status so this job can be a required
    # check even for documentation-only changes.
    if: ${{ !cancelled() && (needs.changes.outputs.source == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve ccache key
        id: ccache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-ci-${{ steps.ccache-key.outputs.date }}
          restore-keys: |
            ccache-${{ runner.os }}-ci-

      - name: Install Build Dependencies
        uses: ./.github/actions/setup-deps

      - name: Configure, Build and Test
        run: cmake --workflow --preset=ci

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-test-results
          path: build-ci/test-results.xml
          if-no-files-found: ignore

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-ci-${{ steps.ccache-key.outputs.date }}
